name: Check and Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: npm run package
      - name: Build Windows single-file application
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          where cl.exe
          if errorlevel 1 exit /b 1
          npm run package
      - name: Check isolated executable without UI or credentials
        run: npm run check:package
      - run: npm run release:files
      - uses: actions/upload-artifact@v4
        with:
          name: codex-window-${{ matrix.target }}
          path: |
            .artifacts/CodexWindow.exe
            .artifacts/CodexWindow.exe.sha256
            .artifacts/codex-window
            .artifacts/codex-window.sha256
          # Only direct executables/checksums, never staging or account folders.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
